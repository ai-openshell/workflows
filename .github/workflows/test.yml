name: test

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test "spdx-check/test/*.test.mjs"

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./spdx-check
        with:
          include: "*.mjs"
