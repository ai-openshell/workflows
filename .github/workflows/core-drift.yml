# SPDX-License-Identifier: Apache-2.0

# Reusable: compares core main with the calling SDK repository's core pin and
# keeps its single "Core main drift" issue current (mise run core:drift). See
# core-sync/README.md for the contract the caller implements.
name: core-drift

on:
  workflow_call:

permissions:
  contents: read

jobs:
  drift:
    name: drift
    # The bot secrets live in the caller's sdk-bot environment, which only
    # main can deploy to, so a pushed branch can't mint a bot token.
    environment: sdk-bot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: core-drift-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SDK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          permission-issues: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false

      - name: Install tools
        run: |
          if [ -f mise.lock ]; then mise install --locked; else mise install; fi

      # Exit 1 with a report means drift; the issue records it. No report
      # means the check itself broke, which the failure step records.
      - name: Check drift against core main
        run: |
          mise run core:drift -- --out "$RUNNER_TEMP/drift-report.md" || true
          test -s "$RUNNER_TEMP/drift-report.md"
          cat "$RUNNER_TEMP/drift-report.md" >>"$GITHUB_STEP_SUMMARY"

      - name: Update the drift issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: mise run core:drift-issue -- "$RUNNER_TEMP/drift-report.md"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: mise run core:report-failure -- core-drift "$RUN_URL"
